[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2.1",
    "edge-tts>=7.2.8",
    "fastapi>=0.142.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "shazamio>=0.8.1",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
jarvis-assistant = "jarvis_assistant:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
